[package]
name = "jockey"
default-run = "jockey"
version = "0.1.0"
description = "Jockey desktop orchestrator"
authors = ["jockey"]
edition = "2021"
license = "MIT"
repository = "https://github.com/recailai/jockey"

[lib]
name = "jockey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-client-protocol = "2.0.0"
base64 = "0.22"
async-trait = "0.1.92"
dashmap = "6.2.1"
dirs = "6"
futures = "0.3"
ignore = "0.4"
libc = "0.2"
nucleo-matcher = "0.3"
git2 = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "sync", "time", "rt"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
which = "8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
