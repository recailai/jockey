<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      (() => {
        let theme = "dark";
        try {
          const saved = window.localStorage.getItem("jockey.ui.theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (_) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #09090b; color: #ededed; }
      :root[data-theme="light"] body, :root[data-theme="light"] #root { background: #f8fafc; color: #0f172a; }
    </style>
    <title>Jockey</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
